[package]
name = "openbill"
version = "0.1.0"
description = "OpenBill desktop app"
authors = ["OpenBill"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openbill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
